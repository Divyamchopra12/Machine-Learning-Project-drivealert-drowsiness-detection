# Runs the automated tests on every push and pull request (GitHub → Actions tab).
name: tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          sudo apt-get update && sudo apt-get install -y libgl1 libglib2.0-0
          grep -v pygame requirements.txt > req-ci.txt
          pip install -r req-ci.txt pytest httpx
      - name: Syntax check
        run: python -m py_compile *.py raspberry_pi/run_pi.py
      - name: Tests
        run: pytest -q
